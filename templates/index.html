<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Flask Blockchain App</title>
	<style>
	textarea {
		width: 100%;
		height: 500px;
		}
	</style>
</head>
<body>
	<!--<form action="/get_chain" method="GET">
		<button type="submit">Chain</button>
	</form>-->
	
	<h1>How does a blockchain work?</h1>

	<button id="btn_valid">Validate</button>
	<p>
	<button id="btn_chain">Show Chain</button>
	<p>
	<button id="btn_mine">Mine Block</button>
	<p>
	<textarea id="chain_area" name="chain_area" readonly>Click a button to interact with blockchain...</textarea>

	
	<script>
		async function fetchData(api_url){
			try{
				const response = await fetch(api_url, {method: "GET"});
				if (!response.ok) throw new Error("Request failed!");
				const data = await response.json();
				console.log("Server response:", data);
				document.getElementById("chain_area").textContent = JSON.stringify(data, null, 2);
			} catch (error) {
				console.error("Error:", error);
		}}
				
		document.getElementById("btn_valid").addEventListener("click", async () => fetchData("/valid"));
		document.getElementById("btn_chain").addEventListener("click", async () => fetchData("/get_chain"));
		document.getElementById("btn_mine").addEventListener("click", async () => fetchData("/mine_block"));
	</script>
</body>
</html>
